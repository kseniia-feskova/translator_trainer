[versions]
kotlin = "2.3.20"
agp = "9.1.0"
ksp = "2.3.2"
coroutines = "1.10.2"
koin = "4.2.0"
serialization = "1.10.0"
ktor = "3.4.2"
google-services = "4.4.4"
androidx-core = "1.18.0"
appcompat = "1.7.1"
room = "2.8.4"
datastore = "1.2.1"
security = "1.1.0"

compose = "1.10.3"
compose-material3 = "1.4.0"
material = "1.4.0"
navigation = "2.9.7"

coil = "2.7.0"

firebase-auth = "24.0.1"

credentials = "1.5.0"
googleid = "1.2.0"
play-services-auth = "21.5.1"

mlkit-translate = "17.0.3"
mlkit-text = "16.0.1"
foundation-layout = "1.10.6"

[libraries]
security = { module = "androidx.security:security-crypto", version.ref = "security" }

# Kotlin
kotlin-stdlib = { module = "org.jetbrains.kotlin:kotlin-stdlib", version.ref = "kotlin" }

# Coroutines
coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }

# Koin
koin-core = { module = "io.insert-koin:koin-core", version.ref = "koin" }

# Serialization
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }

# Ktor
ktor-client-core = { module = "io.ktor:ktor-client-core", version.ref = "ktor" }
ktor-client-content-negotiation = { module = "io.ktor:ktor-client-content-negotiation", version.ref = "ktor" }
ktor-serialization-json = { module = "io.ktor:ktor-serialization-kotlinx-json", version.ref = "ktor" }
ktor-client-logging = { module = "io.ktor:ktor-client-logging", version.ref = "ktor" }

# Core
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "androidx-core" }
appcompat = { module = "androidx.appcompat:appcompat", version.ref = "appcompat" }

# Koin
koin-android = { module = "io.insert-koin:koin-android", version.ref = "koin" }
koin-compose = { module = "io.insert-koin:koin-androidx-compose", version.ref = "koin" }

# Room / DataStore
room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
datastore-preferences = { module = "androidx.datastore:datastore-preferences", version.ref = "datastore" }
room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }

# Ktor
ktor-client-okhttp = { module = "io.ktor:ktor-client-okhttp", version.ref = "ktor" }
ktor-client-ios = { module = "io.ktor:ktor-client-darwin", version.ref = "ktor" }
# Firebase
firebase-auth = { module = "com.google.firebase:firebase-auth", version.ref = "firebase-auth" }

# Compose
compose-runtime = { module = "androidx.compose.runtime:runtime-android", version.ref = "compose" }
compose-material3 = { module = "androidx.compose.material3:material3-android", version.ref = "compose-material3" }
compose-icons = { module = "androidx.compose.material:material-icons-core", version.ref = "material" }
compose-ui-preview = { module = "androidx.compose.ui:ui-tooling-preview-android", version.ref = "compose" }
compose-ui-preview-common = { module = "androidx.compose.ui:ui-tooling-preview", version = "compose" }

# Navigation
navigation-runtime = { module = "androidx.navigation:navigation-runtime-android", version = "navigation" }
navigation-compose = { module = "androidx.navigation:navigation-compose", version.ref = "navigation" }

# Wear (если нужен)
wear-navigation = { module = "androidx.wear.compose:compose-navigation", version = "compose" }

# Coil
coil-compose = { module = "io.coil-kt:coil-compose", version.ref = "coil" }

# Credentials / Google auth
credentials = { module = "androidx.credentials:credentials", version.ref = "credentials" }
credentials-play-services = { module = "androidx.credentials:credentials-play-services-auth", version.ref = "credentials" }
googleid = { module = "com.google.android.libraries.identity.googleid:googleid", version.ref = "googleid" }
play-services-auth = { module = "com.google.android.gms:play-services-auth", version.ref = "play-services-auth" }

# ML Kit
mlkit-translate = { module = "com.google.mlkit:translate", version.ref = "mlkit-translate" }
mlkit-text = { module = "com.google.mlkit:text-recognition", version.ref = "mlkit-text" }
androidx-foundation-layout = { group = "androidx.compose.foundation", name = "foundation-layout", version.ref = "foundation-layout" }

[plugins]
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
jetbrainsCompose = { id = "org.jetbrains.compose", version.ref = "compose" }

ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
android-library = { id = "com.android.library", version.ref = "agp" }
android-application = { id = "com.android.application", version.ref = "agp" }
google-services = { id = "com.google.gms.google-services", version.ref = "google-services" }

[bundles]

compose = [
    "compose-runtime",
    "compose-icons",
    "compose-ui-preview",
    "compose-ui-preview-common",
    "androidx-foundation-layout"
]

navigation = [
    "navigation-runtime",
    "navigation-compose"
]

koin-android = [
    "koin-android",
    "koin-compose"
]

google-auth = [
    "credentials",
    "credentials-play-services",
    "googleid",
    "play-services-auth"
]

mlkit = [
    "mlkit-translate",
    "mlkit-text"
]